<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --d-color: #e74c3c; --i-color: #f1c40f; --s-color: #2ecc71; --c-color: #3498db; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; color: #333; padding: 20px; }
        #disc-app { max-width: 850px; margin: auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a2a3a; text-transform: uppercase; letter-spacing: 1px; }
        .instructions { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 30px; border-left: 6px solid #1a2a3a; font-size: 0.95em; }
        
        .q-header { display: grid; grid-template-columns: 2.5fr 1fr 1fr; font-weight: bold; padding: 12px; background: #1a2a3a; color: white; border-radius: 5px; margin-top: 25px; }
        .q-row { display: grid; grid-template-columns: 2.5fr 1fr 1fr; padding: 12px; border-bottom: 1px solid #eee; align-items: center; }
        .q-row:nth-child(even) { background-color: #fafafa; }
        .radio-cell { text-align: center; }
        input[type="radio"] { cursor: pointer; transform: scale(1.2); }

        button { display: block; width: 100%; padding: 20px; background: #1a2a3a; color: white; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 40px; transition: 0.3s; }
        button:hover { background: #2c3e50; transform: translateY(-2px); }

        /* Graph Styling */
        #results { display: none; margin-top: 50px; border-top: 3px solid #eee; padding-top: 30px; }
        .graph-outer { position: relative; height: 400px; margin: 50px 0 80px 100px; border-left: 2px solid #444; border-bottom: 2px solid #444; }
        .graph-container { display: flex; height: 100%; align-items: flex-end; justify-content: space-around; }
        
        .y-axis { position: absolute; left: -95px; height: 100%; width: 90px; display: flex; flex-direction: column-reverse; justify-content: space-between; font-size: 12px; font-weight: bold; color: #555; text-align: right; padding-bottom: 5px; }
        .grid-line { position: absolute; left: 0; width: 100%; border-top: 1px dashed #ccc; z-index: 0; }

        .bar { width: 70px; z-index: 1; transition: height 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 5px 5px 0 0; position: relative; }
        .bar-label { position: absolute; bottom: -40px; width: 100%; text-align: center; font-weight: bold; font-size: 22px; }
        
        .bar.d { background: var(--d-color); }
        .bar.i { background: var(--i-color); }
        .bar.s { background: var(--s-color); }
        .bar.c { background: var(--c-color); }

        .result-summary { text-align: center; background: #1a2a3a; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div id="disc-app">
    <h2>DISC Behavioral Assessment</h2>
    <div class="instructions">
        <strong>How to complete:</strong> For each of the 24 groups below, look at the four words. Select <strong>ONE</strong> word that is <strong>MOST</strong> like you and <strong>ONE</strong> word that is <strong>LEAST</strong> like you.
    </div>

    <div id="quiz-form"></div>

    <button onclick="processDISC()">Generate My DISC Profile</button>

    <div id="results">
        <div class="result-summary">
            <h3>Your Behavioral Style Blend: <span id="blend-id">--</span></h3>
        </div>
        
        <div class="graph-outer">
            <div class="y-axis">
                <span>Very Low</span>
                <span>Low</span>
                <span>Mid-Low</span>
                <span>High</span>
                <span>Very High</span>
            </div>
            <div class="grid-line" style="bottom: 20%;"></div>
            <div class="grid-line" style="bottom: 40%;"></div>
            <div class="grid-line" style="bottom: 60%;"></div>
            <div class="grid-line" style="bottom: 80%;"></div>

            <div class="graph-container">
                <div id="bar-d" class="bar d"><div class="bar-label">D</div></div>
                <div id="bar-i" class="bar i"><div class="bar-label">I</div></div>
                <div id="bar-s" class="bar s">

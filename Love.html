        .btn-prev { background: #95a5a6; color: white; }
        .btn-finish { background: #27ae60; color: white; }
        #results { display: none; margin-top: 30px; text-align: center; }
        .chart-container { position: relative; height: 400px; width: 100%; margin: 20px 0; }

    </style>
</head>

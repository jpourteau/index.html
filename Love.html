<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISC Self-Assessment</title>
    <style>
        :root {
            --d-color: #e74c3c; /* Red */
            --i-color: #f1c40f; /* Yellow */
            --s-color: #2ecc71; /* Green */
            --c-color: #3498db; /* Blue */
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1, h2 { text-align: center; color: #2c3e50; }
        p.instructions { background: #f9f9f9; padding: 15px; border-left: 5px solid #3498db; margin-bottom: 30px; }

        .question-block { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
        .question-header { background: #34495e; color: white; padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f2f2f2; padding: 10px; text-align: center; font-size: 0.9em; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        .descriptor-text { text-align: left; width: 50%; font-weight: 500; }

        .btn-container { text-align: center; margin-top: 30px; }
        button { background: #27ae60; color: white; border: none; padding: 15px 40px; font-size: 1.2em; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #219150; }

        /* Results Area */
        #results-area { display: none; margin-top: 40px; padding: 20px; border-top: 2px solid #333; }
        
        /* Bar Graph CSS */
        .chart-container { display: flex; justify-content: space-around; align-items: flex-end; height: 300px; border-bottom: 2px solid #333; border-left: 2px solid #333; margin: 50px 0; padding-top: 20px; position: relative; }
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; width: 15%; height: 100%; justify-content: flex-end; }
        .bar { width: 100%; transition: height 1s ease-out; position: relative; border-radius: 5px 5px 0 0; }
        .bar-label { margin-top: 10px; font-weight: bold; font-size: 1.2em; }
        
        /* 5-Level Y-Axis Labels */
        .y-axis-labels { position: absolute; left: -60px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; width: 50px; text-align: right; font-size: 0.8em; color: #777; }

        .d-bar { background-color: var(--d-color); }
        .i-bar { background-color: var(--i-color); }
        .s-bar { background-color: var(--s-color); }
        .c-bar { background-color: var(--c-color); }

        .print-btn { background: #34495e; margin-top: 20px; }

        @media print {
            .question-block, button, .instructions { display: none; }
            #results-area { display: block !important; }
            .bar { -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <h1>DISC Personality Assessment</h1>
    <p class="instructions">
        <strong>Instructions:</strong> For each of the 24 groups below, choose <strong>one</strong> word that is <u>MOST</u> like you and <strong>one</strong> word that is <u>LEAST</u> like you.
    </p>

    <div id="assessment-form">
        </div>

    <div class="btn-container">
        <button onclick="calculateResults()">Generate My DISC Profile</button>
    </div>

    <div id="results-area">
        <h2>Your DISC Results</h2>
        <div class="chart-container">
            <div class="y-axis-labels">
                <span>High</span>
                <span>Above Avg</span>
                <span>Average</span>
                <span>Below Avg</span>
                <span>Low</span>
            </div>
            <div class="bar-wrapper">
                <div id="d-bar" class="bar d-bar" style="height: 0%;"></div>
                <div class="bar-label">D</div>
            </div>
            <div class="bar-wrapper">
                <div id="i-bar" class="bar i-bar" style="height: 0%;"></div>
                <div class="bar-label">I</div>
            </div>
            <div class="bar-wrapper">
                <div id="s-bar" class="bar s-bar" style="height: 0%;"></div>
                <div class="bar-label">S</div>
            </div>
            <div class="bar-wrapper">
                <div id="c-bar" class="bar c-bar" style="height: 0%;"></div>
                <div class="bar-label">C</div>
            </div>
        </div>

        <div id="analysis-text" style="text-align: center; font-size: 1.2em; margin-bottom: 20px;"></div>
        
        <div style="text-align: center;">
            <button class="print-btn" onclick="window.print()">Print or Save as PDF</button>
        </div>
    </div>

    <script>
        // Sample DISC word clusters (24 questions) 
        // Logic: D, I, S, C mapping for each row
        const questions = [
            { id: 1, words: [{t:'D', w:'Gentle'}, {t:'I', w:'Persuasive'}, {t:'S', w:'Humble'}, {t:'C', w:'Original'}] },
            { id: 2, words: [{t:'I', w:'Attractive'}, {t:'C', w:'Patient'}, {t:'D', w:'Receptive'}, {t:'S', w:'Cordial'}] },
            { id: 3, words: [{t:'S', w:'Easygoing'}, {t:'D', w:'Adventurous'}, {t:'I', w:'Life of the Party'}, {t:'C', w:'Soft-spoken'}] },
            { id: 4, words: [{t:'C', w:'Conscientious'}, {t:'S', w:'Satisfied'}, {t:'D', w:'Assertive'}, {t:'I', w:'Spirited'}] },
            // ... (I have initialized the first 4, JavaScript will loop to 24 for the logic)
        ];

        // For brevity in this demo, I am repeating the pattern to reach 24. 
        // In a live version, you would replace these with your specific Personality Insights Word Lists.
        for (let i = 5; i <= 24; i++) {
            questions.push({ id: i, words: questions[(i-1)%4].words });
        }

        const formContainer = document.getElementById('assessment-form');

        questions.forEach((q, index) => {
            let html = `
                <div class="question-block">
                    <div class="question-header">Question ${q.id}</div>
                    <table>
                        <tr><th>Descriptor</th><th>Most (M)</th><th>Least (L)</th></tr>`;
            
            q.words.forEach((wordObj, i) => {
                html += `
                    <tr>
                        <td class="descriptor-text">${wordObj.w}</td>
                        <td><input type="radio" name="q${index}-most" value="${wordObj.t}" required></td>
                        <td><input type="radio" name="q${index}-least" value="${wordObj.t}" required></td>
                    </tr>`;
            });

            html += `</table></div>`;
            formContainer.innerHTML += html;
        });

        function calculateResults() {
            let scores = { D: 0, I: 0, S: 0, C: 0 };
            
            for (let i = 0; i < 24; i++) {
                const most = document.querySelector(`input[name="q${i}-most"]:checked`);
                const least = document.querySelector(`input[name="q${i}-least"]:checked`);
                
                if (!most || !least) {
                    alert("Please answer all questions (Select one Most and one Least for each).");
                    return;
                }
                
                if (most.value === least.value) {
                    alert("On Question " + (i+1) + ", you cannot select the same word for both Most and Least.");
                    return;
                }

                scores[most.value]++;
                // Least selection can either subtract or be a separate tally. 
                // Dr. Rohm logic usually uses a specific conversion table. 
                // Here we calculate the "Net" score.
                scores[least.value]--;
            }

            // Normalize scores to a 0-100% scale for the 5-level bar graph
            // 24 is max possible "Most", -24 is min "Least". 
            const displayResults = (trait) => {
                let raw = scores[trait];
                // Convert -24 to 24 range into 0 to 100 percentage
                let percentage = ((raw + 24) / 48) * 100;
                document.getElementById(`${trait.toLowerCase()}-bar`).style.height = percentage + "%";
            };

            ['D', 'I', 'S', 'C'].forEach(displayResults);

            document.getElementById('results-area').style.display = 'block';
            document.getElementById('analysis-text').innerText = "Assessment Complete. See your DISC blend below.";
            window.scrollTo(0, document.getElementById('results-area').offsetTop);
        }
    </script>
</body>
</html>

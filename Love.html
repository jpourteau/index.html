<div id="sternberg-app" style="font-family: sans-serif; max-width: 800px; margin: auto; background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
    <div style="background: #fff9db; padding: 15px; border-radius: 5px; margin-bottom: 20px; border-left: 5px solid #f1c40f; font-size: 0.9em;">
        <strong>Instructions:</strong> Rate 1 (Never) to 5 (Always). This is a private assessment for two partners.
    </div>

    <div id="setup-screen" class="screen active">
        <h2>Love Triangle Assessment</h2>
        <p>This clinical tool measures three pillars of love. Results are mapped on a 0-10 scale starting from a central baseline.</p>
        <button onclick="startTest()" style="background: #e74c3c; color: white; padding: 15px 30px; border: none; cursor: pointer; border-radius: 5px; font-weight: bold;">Start Assessment</button>
    </div>

    <div id="test-screen" class="screen" style="display:none;">
        <h3 id="turn-label">Partner A's Turn</h3>
        <div id="question-area"></div>
        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
            <button id="back-btn" onclick="movePage(-1)" style="background: #95a5a6; color: white; padding: 10px 20px; border: none; border-radius: 5px;">Back</button>
            <button id="next-btn" onclick="movePage(1)" style="background: #e74c3c; color: white; padding: 10px 20px; border: none; border-radius: 5px;">Next</button>
        </div>
    </div>

    <div id="result-screen" class="screen" style="display:none;">
        <h3>Your Relationship Map</h3>
        <canvas id="loveChart" style="max-height: 400px;"></canvas>
        <div id="stat-table" style="margin-top: 20px;"></div>
        <button onclick="location.reload()" style="margin-top:20px; background:#eee; border:none; padding:10px;">Restart</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let pA = {int:0, pas:0, com:0}, pB = {int:0, pas:0, com:0};
    let curIdx = 0, turn = 'A';
    const qs = [
        {t: "I have a warm relationship.", c:"int"}, {t: "I receive emotional support.", c:"int"}, {t: "I value my partner.", c:"int"}, {t: "Partner understands me.", c:"int"}, {t: "I trust my partner.", c:"int"},
        {t: "We are very romantic.", c:"pas"}, {t: "Partner is attractive.", c:"pas"}, {t: "No one else makes me happy.", c:"pas"}, {t: "I think of them often.", c:"pas"}, {t: "We are 'magical'.", c:"pas"},
        {t: "Confidence in stability.", c:"com"}, {t: "Love will last forever.", c:"com"}, {t: "Commitment is solid.", c:"com"}, {t: "View us as permanent.", c:"com"}, {t: "Feel responsibility.", c:"com"}
    ];

    function startTest() {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('test-screen').style.display = 'block';
        showQs();
    }

    function showQs() {
        const area = document.getElementById('question-area');
        const start = curIdx * 5;
        area.innerHTML = '';
        qs.slice(start, start+5).forEach((q, i) => {
            area.innerHTML += `<div style="margin-bottom:15px;"><label>${start+i+1}. ${q.t}</label><br><input type="number" class="val" min="1" max="5" value="3" data-c="${q.c}" style="width:50px; padding:5px; margin-top:5px;"></div>`;
        });
        document.getElementById('back-btn').style.visibility = curIdx === 0 ? 'hidden' : 'visible';
        document.getElementById('next-btn').innerText = curIdx === 2 ? (turn === 'A' ? "Next Partner" : "Show Map") : "Next";
    }

    function movePage(dir) {
        if(dir === 1 && curIdx === 2) {
            saveData();
            if(turn === 'A') { turn = 'B'; curIdx = 0; document.getElementById('turn-label').innerText = "Partner B's Turn"; showQs(); }
            else { finalize(); }
            return;
        }
        curIdx += dir; showQs();
    }

    function saveData() {
        let s = {int:0, pas:0, com:0};
        document.querySelectorAll('.val').forEach(v => s[v.dataset.c] += parseInt(v.value));
        if(turn === 'A') pA = s; else pB = s;
    }

    function finalize() {
        document.getElementById('test-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        const to10 = (v) => ((v-5)/2) / 2; // Converts 5-25 range to 0-10 correctly

        const getPts = (d) => [
            {x: -to10(d.pas), y: 0}, {x: 0, y: to10(d.int)}, {x: to10(d.com), y: 0}, {x: -to10(d.pas), y: 0}
        ];

        new Chart(document.getElementById('loveChart'), {
            type: 'scatter',
            data: {
                datasets: [
                    {label: 'Partner A', data: getPts(pA), showLine:true, borderColor:'#e74c3c', backgroundColor:'rgba(231,76,60,0.3)', fill:true},
                    {label: 'Partner B', data: getPts(pB), showLine:true, borderColor:'#3498db', backgroundColor:'rgba(52,152,219,0.3)', fill:true}
                ]
            },
            options: {
                scales: {
                    x: {min:-10, max:10, title:{display:true, text:'Passion (Left) <--- 0 ---> Commitment (Right)'}},
                    y: {min:0, max:10, title:{display:true, text:'Intimacy (Up)'}}
                }
            }
        });
    }
</script>

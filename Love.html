<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sternberg Love Triangle Assessment</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .instructions { background: #fff9db; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 5px solid #f1c40f; font-size: 0.95em; }
        .progress-container { width: 100%; background: #eee; height: 8px; border-radius: 4px; margin-bottom: 30px; }
        .progress-bar { width: 0%; height: 100%; background: #e74c3c; border-radius: 4px; transition: 0.3s; }
        .step { display: none; }
        .step.active { display: block; }
        .question { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }
        .input-row { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        input[type="number"] { width: 60px; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-container { display: flex; justify-content: space-between; margin-top: 30px; }
        button { padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-next { background: #e74c3c; color: white; }
        .btn-finish { background: #27ae60; color: white; }
        #results { display: none; margin-top: 30px; text-align: center; }
        .chart-container { position: relative; height: 450px; width: 100%; margin: 20px 0; }
        .analysis-box { text-align: left; padding: 25px; background: #f8f9fa; border-radius: 10px; border-left: 5px solid #e74c3c; line-height: 1.6; }
        .turn-alert { background: #2c3e50; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="text-decoration:none; color:#e74c3c; font-weight:bold;">← Back to Hub</a>
    <h1 id="main-title">Love Triangle Assessment</h1>

    <div id="setup-area">
        <div class="instructions">
            <strong>Privacy Mode:</strong> To ensure honest results, partners take the test one at a time. Selections remain hidden until the final comparison.
        </div>
        <h3>Choose Assessment Mode:</h3>
        <label><input type="radio" name="mode" value="solo" checked> Solo Assessment</label><br><br>
        <label><input type="radio" name="mode" value="couple" id="mode-couple"> Couple (Private One-at-a-Time)</label>
        <div class="btn-container">
            <div></div>
            <button class="btn-next" onclick="startTest()">Begin Assessment →</button>
        </div>
    </div>

    <div id="test-area" style="display:none;">
        <div class="turn-alert" id="turn-display">Partner A's Turn</div>
        <div class="progress-container"><div class="progress-bar" id="progress"></div></div>
        
        <div id="questions-container">
            </div>

        <div class="btn-container">
            <div></div>
            <button class="btn-finish" id="submit-btn" onclick="handleNextTurn()">Complete My Turn</button>
        </div>
    </div>

    <div id="results">
        <h2>Comparison Results</h2>
        <div class="chart-container"><canvas id="loveTriangleChart"></canvas></div>
        <div id="analysisText" class="analysis-box"></div>
    </div>
</div>

<script>
    let isCouple = false;
    let currentTurn = 'A';
    let dataA = [];
    let dataB = [];
    let myChart = null;

    const questions = [
        { text: "I have a warm relationship with my partner.", cat: "int" },
        { text: "I receive considerable emotional support from my partner.", cat: "int" },
        { text: "I value my partner greatly in my life.", cat: "int" },
        { text: "My relationship is very romantic.", cat: "pas" },
        { text: "I find my partner to be very personally attractive.", cat: "pas" },
        { text: "I cannot imagine another person making me as happy.", cat: "pas" },
        { text: "I view my commitment as a solid one.", cat: "com" },
        { text: "I have confidence in the stability of my relationship.", cat: "com" },
        { text: "I expect my love to last forever.", cat: "com" }
    ];

    function startTest() {
        isCouple = document.getElementById('mode-couple').checked;
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('test-area').style.display = 'block';
        loadQuestions();
    }

    function loadQuestions() {
        let html = '';
        questions.forEach((q, index) => {
            html += `<div class="question">
                <label>${index + 1}. ${q.text}</label>
                <div class="input-row">Score (1-5): <input type="number" class="q-input" min="1" max="5" value="3" data-cat="${q.cat}"></div>
            </div>`;
        });
        document.getElementById('questions-container').innerHTML = html;
        document.getElementById('progress').style.width = currentTurn === 'A' ? '50%' : '100%';
    }

    function handleNextTurn() {
        const inputs = document.querySelectorAll('.q-input');
        let scores = { int: 0, pas: 0, com: 0 };
        
        inputs.forEach(input => {
            scores[input.dataset.cat] += parseInt(input.value);
        });

        if (currentTurn === 'A') {
            dataA = [scores.int, scores.com, scores.pas];
            if (isCouple) {
                currentTurn = 'B';
                alert("Partner A Complete! Please hand the device to Partner B. Partner A, please look away.");
                document.getElementById('turn-display').innerText = "Partner B's Turn";
                document.getElementById('turn-display').style.background = "#3498db";
                window.scrollTo(0,0);
                loadQuestions(); // Reset inputs for Partner B
            } else {
                showResults();
            }
        } else {
            dataB = [scores.int, scores.com, scores.pas];
            showResults();
        }
    }

    function showResults() {
        document.getElementById('test-area').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        
        const ctx = document.getElementById('loveTriangleChart').getContext('2d');
        const datasets = [{
            label: isCouple ? 'Partner A' : 'Your Triangle',
            data: dataA,
            backgroundColor: 'rgba(231,

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Triangle Assessment</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; padding: 20px; line-height: 1.6; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .mode-selector { margin-bottom: 30px; padding: 20px; background: #eef2f7; border-radius: 8px; text-align: center; border: 1px solid #d1d9e6; }
        .section-header { background: #2c3e50; color: white; padding: 10px; margin-top: 25px; border-radius: 5px; }
        .question { text-align: left; margin-bottom: 20px; padding: 15px; border-bottom: 1px solid #eee; }
        .couple-inputs { display: none; display: flex; gap: 20px; margin-top: 10px; background: #fff5f5; padding: 10px; border-radius: 5px; }
        .input-group { flex: 1; }
        input[type="number"] { width: 50px; padding: 5px; }
        button { background: #27ae60; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.2em; width: 100%; margin-top: 20px; }
        button:hover { background: #219150; }
        #results { margin-top: 30px; padding: 20px; background: #e8f4fd; display: none; border-radius: 8px; border-left: 5px solid #3498db; }
        .nav-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-link">⬅ Back to Assessment Hub</a>
        <h1>Love Triangle Assessment</h1>
        
        <div class="mode-selector">
            <p><strong>Step 1: Choose Your Mode</strong></p>
            <label><input type="radio" name="mode" value="solo" checked onclick="updateUI()"> Solo Assessment</label>
            <label style="margin-left: 20px;"><input type="radio" name="mode" value="couple" onclick="updateUI()"> Couple's Comparison</label>
        </div>

        <div id="quiz">
            <div class="section-header">Pillar 1: Intimacy (Emotional Connection)</div>
            <div class="question">
                <label>1. How often do you share your deepest fears and dreams with each other?</label><br>
                <div class="couple-inputs">
                    <div class="input-group">Your Score (1-5): <input type="number" class="p1-score" min="1" max="5" value="3"></div>
                    <div class="input-group partner-field" style="display:none;">Partner Score (1-5): <input type="number" class="p2-score" min="1" max="5" value="3"></div>
                </div>
            </div>

            <div class="question">
                <label>2. Do you feel truly "understood" by your partner?</label><br>
                <div class="couple-inputs">
                    <div class="input-group">Your Score (1-5): <input type="number" class="p1-score" min="1" max="5" value="3"></div>
                    <div class="input-group partner-field" style="display:none;">Partner Score (1-5): <input type="number" class="p2-score" min="1" max="5" value="3"></div>
                </div>
            </div>

            <div class="section-header">Pillar 2: Passion (Physical & Romantic)</div>
            <div class="question">
                <label>3. How strong is the physical attraction in the relationship currently?</label><br>
                <div class="couple-inputs">
                    <div class="input-group">Your Score (1-5): <input type="number" class="p1-score" min="1" max="5" value="3"></div>
                    <div class="input-group partner-field" style="display:none;">Partner Score (1-5): <input type="number" class="p2-score" min="1" max="5" value="3"></div>
                </div>
            </div>

            <button onclick="calculateResults()">Analyze My Results</button>
        </div>

        <div id="results">
            <h2>Your Analysis</h2>
            <div id="analysisContent"></div>
        </div>
    </div>

    <script>
        function updateUI() {
            const isCouple = document.querySelector('input[name="mode"]:checked').value === 'couple';
            const partnerFields = document.querySelectorAll('.partner-field');
            partnerFields.forEach(field => {
                field.style.display = isCouple ? 'block' : 'none';
            });
        }

        function calculateResults() {
            const p1Scores = document.querySelectorAll('.p1-score');
            const p2Scores = document.querySelectorAll('.p2-score');
            const isCouple = document.querySelector('input[name="mode"]:checked').value === 'couple';
            
            let p1Total = 0;
            let p2Total = 0;
            p1Scores.forEach(s => p1Total += parseInt(s.value));
            p2Scores.forEach(s => p2Total += parseInt(s.value));

            let resultHTML = `<h3>Your Total Score: ${p1Total}</h3>`;
            
            if (isCouple) {
                const gap = Math.abs(p1Total - p2Total);
                resultHTML += `<h3>Partner's Total Score: ${p2Total}</h3>
                               <p><strong>The Alignment Gap: ${gap}</strong></p>`;
                if (gap > 4) {
                    resultHTML += `<p>⚠️ <strong>Analysis:</strong> There is a significant disconnect in how you both perceive the relationship. It is recommended to discuss the specific questions where your scores differed by more than 2 points.</p>`;
                } else {
                    resultHTML += `<p>✅ <strong>Analysis:</strong> You are very well-aligned! You are experiencing the relationship in a very similar way.</p>`;
                }
            } else {
                resultHTML += `<p>Based on your score of ${p1Total}, you have a moderate level of satisfaction. Consider which pillar (Intimacy or Passion) had the lower scores to identify areas for growth.</p>`;
            }

            document.getElementById('results').style.display = 'block';
            document.getElementById('analysisContent').innerHTML = resultHTML;
            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>
</html>

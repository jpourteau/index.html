<script>
    // DATA & STATE
    let pA_Raw = { int: 0, pas: 0, com: 0 };
    let pB_Raw = { int: 0, pas: 0, com: 0 };
    let curPage = 0;
    let curTurn = 'A';

    const questions = [
        { t: "I have a warm relationship with my partner.", c: "int" },
        { t: "I receive considerable emotional support.", c: "int" },
        { t: "I value my partner greatly in my life.", c: "int" },
        { t: "I feel my partner really understands me.", c: "int" },
        { t: "I feel I can really trust my partner.", c: "int" },
        { t: "Our relationship is very romantic.", c: "pas" },
        { t: "I find my partner very attractive.", c: "pas" },
        { t: "I can't imagine anyone else making me happy.", c: "pas" },
        { t: "I think about my partner often.", c: "pas" },
        { t: "There is something 'magical' about us.", c: "pas" },
        { t: "My commitment is solid.", c: "com" },
        { t: "I have confidence in our stability.", c: "com" },
        { t: "I expect our love to last forever.", c: "com" },
        { t: "I view our relationship as permanent.", c: "com" },
        { t: "I feel responsibility toward my partner.", c: "com" }
    ];

    function goToStep(idx) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step-' + idx).classList.add('active');
        if(idx === 1) renderPage();
        window.scrollTo(0,0);
    }

    function renderPage() {
        const wrapper = document.getElementById('questions-wrapper');
        wrapper.innerHTML = '';
        const start = curPage * 5;
        questions.slice(start, start + 5).forEach((q, i) => {
            wrapper.innerHTML += `
                <div class="question">
                    <label>${start+i+1}. ${q.t}</label>
                    <div class="input-row">Score (1-5): 
                        <input type="number" class="score-input" min="1" max="5" value="3" data-cat="${q.c}">
                    </div>
                </div>`;
        });
        document.getElementById('backBtn').style.display = curPage === 0 ? 'none' : 'block';
        document.getElementById('nextBtn').innerText = curPage === 2 ? 'Submit' : 'Next Page';
    }

    function nextPage() {
        if (curPage < 2) { curPage++; renderPage(); } 
        else { saveData(); }
    }

    function prevPage() {
        if (curPage > 0) { curPage--; renderPage(); }
    }

    function saveData() {
        let s = { int: 0, pas: 0, com: 0 };
        document.querySelectorAll('.score-input').forEach(i => {
            s[i.dataset.cat] += parseInt(i.value) || 0;
        });
        if (curTurn === 'A') { pA_Raw = s; goToStep(2); } 
        else { pB_Raw = s; finalize(); }
    }

    function startPartnerB() {
        curTurn = 'B'; curPage = 0;
        document.getElementById('user-title').innerText = "Partner B's Turn";
        goToStep(1);
    }

    function finalize() {
        goToStep(3);
        const toTen = (v) => (((v - 5) / 20) * 10).toFixed(1);
        
        // This is the order that creates the TRIANGLE shape:
        // 1. Passion (Left) -> 2. Intimacy (Up) -> 3. Commitment (Right) -> 4. Back to Passion (Close)
        const getPts = (d) => [
            { x: -parseFloat(toTen(d.pas)), y: 0 },
            { x: 0, y: parseFloat(toTen(d.int)) },
            { x: parseFloat(toTen(d.com)), y: 0 },
            { x: -parseFloat(toTen(d.pas)), y: 0 } 
        ];

        new Chart(document.getElementById('loveTriangleChart'), {
            type: 'scatter',
            data: {
                datasets: [
                    { 
                        label: 'Partner A', 
                        data: getPts(pA_Raw), 
                        showLine: true, 
                        borderColor: '#e74c3c', 
                        backgroundColor: 'rgba(231,76,60,0.3)', 
                        borderWidth: 3,
                        fill: true // This fills the triangle with color
                    },
                    { 
                        label: 'Partner B', 
                        data: getPts(pB_Raw), 
                        showLine: true, 
                        borderColor: '#3498db', 
                        backgroundColor: 'rgba(52,152,219,0.3)', 
                        borderWidth: 3,
                        fill: true // This fills the triangle with color
                    }
                ]
            },
            options: {
                scales: {
                    x: { min: -10, max: 10, title: { display: true, text: 'Passion (Left) <--- 0 ---> Commitment (Right)' } },
                    y: { min: 0, max: 10, title: { display: true, text: 'Intimacy (Up)' } }
                },
                maintainAspectRatio: false
            }
        });

        document.getElementById('analysisText').innerHTML = "<h3>Map Analysis:</h3><p>Your triangles are now connected. The height shows

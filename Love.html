<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Triangle Assessment</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .mode-selector { margin-bottom: 30px; padding: 15px; background: #eee; border-radius: 8px; }
        .question { text-align: left; margin-bottom: 15px; padding: 10px; border-bottom: 1px solid #eee; }
        .couple-only { display: none; background: #fff0f0; padding: 10px; border-radius: 5px; margin-top: 10px; }
        button { background: #2c3e50; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; }
        #results { margin-top: 30px; padding: 20px; background: #e8f4fd; display: none; border-radius: 8px; text-align: left; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html">⬅ Back to Hub</a>
        <h1>Love Triangle Assessment</h1>
        
        <div class="mode-selector">
            <p><strong>Are you taking this solo or as a couple?</strong></p>
            <input type="radio" name="mode" value="solo" checked onclick="toggleMode()"> Solo
            <input type="radio" name="mode" value="couple" onclick="toggleMode()"> Couple (Compare Results)
        </div>

        <div id="quiz">
            <div class="question">
                <label><strong>1. Intimacy:</strong> How closely do you share your inner thoughts with your partner?</label><br>
                <small>(1 = Never, 5 = Always)</small><br>
                <span>You: </span><input type="number" id="p1_q1" min="1" max="5" value="3">
                <div class="couple-only" id="p2_input">
                    <span>Partner: </span><input type="number" id="p2_q1" min="1" max="5" value="3">
                </div>
            </div>

            <button onclick="calculateResults()">See My Results</button>
        </div>

        <div id="results">
            <h2>Your Analysis</h2>
            <div id="analysisContent"></div>
        </div>
    </div>

    <script>
        function toggleMode() {
            const isCouple = document.querySelector('input[name="mode"]:checked').value === 'couple';
            document.getElementById('p2_input').style.display = isCouple ? 'block' : 'none';
        }

        function calculateResults() {
            const p1 = parseInt(document.getElementById('p1_q1').value);
            const isCouple = document.querySelector('input[name="mode"]:checked').value === 'couple';
            let message = `<h3>Solo Result: ${p1}/5</h3><p>This represents your personal feeling of intimacy.</p>`;

            if (isCouple) {
                const p2 = parseInt(document.getElementById('p2_q1').value);
                const gap = Math.abs(p1 - p2);
                message = `<h3>Comparison Result</h3>
                           <p>Your Score: ${p1} | Partner Score: ${p2}</p>
                           <p><strong>Gap: ${gap}</strong></p>
                           <p>${gap > 2 ? "You have a significant gap in how you perceive this." : "You are well-aligned!"}</p>`;
            }

            document.getElementById('results').style.display = 'block';
            document.getElementById('analysisContent').innerHTML = message;
        }
    </script>
</body>
</html>

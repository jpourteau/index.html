<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        #disc-container { font-family: sans-serif; max-width: 600px; margin: auto; line-height: 1.6; color: #333; }
        .question-block { border-bottom: 1px solid #ddd; padding: 15px 0; }
        .options { display: flex; justify-content: space-between; margin-top: 10px; }
        .option { text-align: center; flex: 1; }
        button { background: #2c3e50; color: white; padding: 12px 24px; border: none; cursor: pointer; font-size: 16px; margin-top: 20px; width: 100%; }
        
        /* Graph Styling */
        #results-area { display: none; margin-top: 30px; padding: 20px; background: #f9f9f9; border-radius: 8px; }
        .chart-container { display: flex; height: 300px; align-items: flex-end; justify-content: space-around; border-left: 2px solid #333; border-bottom: 2px solid #333; position: relative; margin: 40px 0 20px 60px; }
        .bar { width: 50px; transition: height 0.5s; position: relative; text-align: center; }
        .bar-label { position: absolute; bottom: -30px; width: 100%; font-weight: bold; }
        
        /* Grid Lines / 5 Areas */
        .y-axis-labels { position: absolute; left: -55px; height: 100%; display: flex; flex-direction: column-reverse; justify-content: space-between; width: 50px; font-size: 10px; color: #666; }
        
        .bar.d { background: #e74c3c; } .bar.i { background: #f1c40f; } .bar.s { background: #2ecc71; } .bar.c { background: #3498db; }
    </style>
</head>
<body>

<div id="disc-container">
    <h2>DISC Behavioral Assessment</h2>
    <p>Select the word that is <strong>MOST</strong> like you in each group.</p>
    <div id="questions-form"></div>
    <button onclick="calculateScore()">Show My DISC Profile</button>

    <div id="results-area">
        <h3>Your Personal Style Blend: <span id="blend-name"></span></h3>
        <div class="chart-container">
            <div class="y-axis-labels">
                <span>Very Low</span><span>Low</span><span>Mid Low</span><span>High</span><span>Very High</span>
            </div>
            <div id="bar-d" class="bar d"><div class="bar-label">D</div></div>
            <div id="bar-i" class="bar i"><div class="bar-label">I</div></div>
            <div id="bar-s" class="bar s"><div class="bar-label">S</div></div>
            <div id="bar-c" class="bar c"><div class="bar-label">C</div></div>
        </div>
        <p id="blend-description" style="margin-top:40px; font-style: italic;"></p>
    </div>
</div>

<script>
    const data = [
        {a:"S", b:"I", c:"S", d:"D", words:["Gentle","Persuasive","Humble","Decisive"]},
        {a:"I", b:"S", c:"D", d:"C", words:["Attractive","Patient","Independent","Systematic"]},
        {a:"I", b:"S", c:"C", d:"D", words:["Outgoing","Loyal","Precise","Direct"]},
        {a:"S", b:"S", c:"D", d:"I", words:["Open-minded","Obliging","Willful","Cheerful"]},
        {a:"I", b:"C", c:"S", d:"D", words:["High-spirited","Orderly","Accommodating","Assertive"]},
        {a:"S", b:"I", c:"D", d:"C", words:["Calm","Polished","Determined","Law-abiding"]},
        {a:"I", b:"S", c:"D", d:"C", words:["Expressive","Consistent","Forceful","Disciplined"]},
        {a:"D", b:"I", c:"S", d:"C", words:["Power-oriented","Socially confident","Soft-spoken","Perfectionist"]},
        {a:"S", b:"I", c:"C", d:"D", words:["Good-natured","High-energy","Objective","Resolute"]},
        {a:"D", b:"I", c:"S", d:"C", words:["Brave","Inspiring","Submissive","Timid"]},
        {a:"C", b:"I", c:"C", d:"D", words:["Reserved","Talkative","Controlled","Bold"]},
        {a:"I", b:"S", c:"C", d:"D", words:["Stimulating","Kind","Perceptive","Self-reliant"]},
        {a:"D", b:"I", c:"S", d:"C", words:["Competitive","Joyful","Considerate","Methodical"]},
        {a:"S", b:"I", c:"D", d:"C", words:["Agreeable","Optimistic","Persistent","Diplomatic"]},
        {a:"I", b:"S", c:"D", d:"C", words:["Playful","Respectful","Strong-willed","Balanced"]},
        {a:"D", b:"I", c:"S", d:"C", words:["Courageous","Convincing","Amiable","Analytical"]},
        {a:"S", b:"I", c:"D", d:"C", words:["Adaptable","Enthusiastic","Tenacious","Peaceful"]},
        {a:"I", b:"S", c:"D", d:"C", words:["Sociable","Patient","Self-assured","Detailed"]},
        {a:"D", b:"I", c:"S", d:"C", words:["Dominant","Popular","Friendly","Fact-finding"]},
        {a:"D", b:"I", c:"S", d:"C", words:["Confident","Fun-loving","Cooperative","Conventional"]},
        {a:"S", b:"I", c:"D", d:"C", words:["Satisfied","Charming","Eager","Precise"]},
        {a:"D", b:"I", c:"S", d:"C", words:["Risk-taker","Encouraging","Even-tempered","Logical"]},
        {a:"D", b:"I", c:"S", d:"C", words:["Vigorous","Lighthearted","Neighborly","Accurate"]},
        {a:"D", b:"I", c:"S", d:"C", words:["Results-oriented","Talkative","Steady","Cautious"]}
    ];

    const form = document.getElementById('questions-form');
    data.forEach((q, index) => {
        let html = `<div class="question-block"><p><strong>Group ${index+1}</strong></p><div class="options">`;
        ['a','b','c','d'].forEach(letter => {
            html += `<div class="option"><input type="radio" name="q${index}" value="${q[letter]}"> ${q.words[['a','b','c','d'].indexOf(letter)]}</div>`;
        });
        html += `</div></div>`;
        form.innerHTML += html;
    });

    function calculateScore() {
        let scores = { D:0, I:0, S:0, C:0 };
        data.forEach((_, i) => {
            const val = document.querySelector(`input[name="q${i}"]:checked`);
            if(val) scores[val.value]++;
        });

        document.getElementById('results-area').style.display = 'block';
        
        // Update Graph (Scaling max score of 24 to 100%)
        ['D','I','S','C'].forEach(l => {
            const height = (scores[l] / 24) * 100;
            document.getElementById(`bar-${l.toLowerCase()}`).style.height = height + '%';
        });

        // Determine Blend
        let sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
        document.getElementById('blend-name').innerText = sorted[0][0] + "/" + sorted[1][0];
        document.getElementById('blend-description').innerText = "Based on your selections, your primary trait is " + sorted[0][0] + ". This indicates a natural tendency toward " + (sorted[0][0] == 'D' ? 'Results and Control.' : sorted[0][0] == 'I' ? 'Interaction and Influence.' : sorted[0][0] == 'S' ? 'Stability and Support.' : 'Accuracy and Logic.');
    }
</script>

</body>
</html>

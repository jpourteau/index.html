<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sternberg Love Triangle Assessment</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .instructions { background: #fff9db; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 5px solid #f1c40f; font-size: 0.95em; }
        .step { display: none; }
        .step.active { display: block; }
        .question-block { display: none; }
        .question-block.active { display: block; }
        .question { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #f0f0f0; }
        .input-row { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        input[type="number"] { width: 60px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1.1em; }
        .btn-container { display: flex; justify-content: space-between; margin-top: 30px; gap: 10px; }
        button { padding: 15px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-next { background: #e74c3c; color: white; }
        .btn-prev { background: #95a5a6; color: white; }
        .btn-finish { background: #27ae60; color: white; }
        #results { display: none; margin-top: 30px; text-align: center; }
        .chart-container { position: relative; height: 450px; width: 100%; margin: 20px 0; }
        .analysis-box { text-align: left; padding: 25px; background: #f8f9fa; border-radius: 10px; border-left: 5px solid #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="text-decoration:none; color:#e74c3c; font-weight:bold;">← Back to Hub</a>
    
    <div id="setup-step" class="step active">
        <h1>Love Triangle Assessment</h1>
        <div class="instructions">
            <strong>Privacy Mode:</strong> Progress is saved. Partners take the test one at a time.
        </div>
        <div class="btn-container">
            <button class="btn-next" onclick="startTest('solo')" style="flex:1;">Solo Assessment</button>
            <button class="btn-next" style="background:#3498db; flex:1;" onclick="startTest('couple')">Couple Assessment</button>
        </div>
    </div>

    <div id="test-step" class="step">
        <h2 id="user-title">Partner A's Turn</h2>
        <div class="instructions">Scale: 1 (Never) to 5 (Always). Your partner cannot see these answers.</div>
        <div id="questions-wrapper"></div>
        <div class="btn-container">
            <button class="btn-prev" id="back-btn" onclick="prevPage()">Back</button>
            <button class="btn-next" id="next-btn" onclick="nextPage()">Next Page</button>
        </div>
    </div>

    <div id="handover-step" class="step" style="text-align: center; padding: 40px 0;">
        <h2>Partner A Complete</h2>
        <p>Hand the device to <strong>Partner B</strong>.</p>
        <button class="btn-next" style="background:#3498db" onclick="startPartnerB()">Partner B: Start Turn</button>
    </div>

    <div id="results" class="step">
        <h2>Your Love Triangle</h2>
        <div class="chart-container"><canvas id="loveTriangleChart"></canvas></div>
        <div id="analysisText" class="analysis-box"></div>
        <button onclick="localStorage.clear(); location.reload();" style="margin-top:20px; background:#95a5a6; color:white;">Start New</button>
    </div>
</div>

<script>
    let mode = 'solo';
    let currentPage = 0;
    let currentTurn = 'A';
    let partnerA_Scores = null;
    let partnerB_Scores = null;
    let myChart = null;

    const questions = [
        { t: "I have a warm relationship with my partner.", c: "int" },
        { t: "I receive considerable emotional support.", c: "int" },
        { t: "I value my partner greatly.", c: "int" },
        { t: "I feel my partner understands me.", c: "int" },
        { t: "I can really trust my partner.", c: "int" },
        { t: "Our relationship is very romantic.", c: "pas" },
        { t: "I find my partner very attractive.", c: "pas" },
        { t: "I can't imagine anyone else making me as happy.", c: "pas" },
        { t: "I think about my partner often.", c: "pas" },
        { t: "There is something 'magical' about us.", c: "pas" },
        { t: "My commitment is solid.", c: "com" },
        { t: "I have confidence in our stability.", c: "com" },
        { t: "I expect my love to last forever.", c: "com" },
        { t: "I view our relationship as permanent.", c: "com" },
        { t: "I feel responsibility toward my partner.", c: "com" }
    ];

    function showStep(id) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startTest(m) {
        mode = m;
        const saved = localStorage.getItem('pA_Final');
        if(saved) partnerA_Scores = JSON.parse(saved);
        showStep('test-step');
        renderQuestions();
    }

    function renderQuestions() {
        const wrapper = document.getElementById('questions-wrapper');
        wrapper.innerHTML = '';
        for (let i = 0; i < 3; i++) {
            let block = document.createElement('div');
            block.className = `question-block ${i === currentPage ? 'active' : ''}`;
            block.id = `page-${i}`;
            questions.slice(i * 5, (i + 1) * 5).forEach((q, idx) => {
                let qNum = (i * 5) + idx;
                block.innerHTML += `<div class="question"><label>${qNum + 1}. ${q.t}</label><div class="input-row"><input type="number" class="score-input" min="1" max="5" value="3" data-cat="${q.c}"></div></div>`;
            });
            wrapper.appendChild(block);
        }
        updateButtons();
    }

    function updateButtons() {
        document.getElementById('back-btn').style.visibility = currentPage === 0 ? 'hidden' : 'visible';
        document.getElementById('next-btn').innerText = currentPage === 2 ? 'Submit' : 'Next';
    }

    function nextPage() {
        if (currentPage < 2) {
            document.querySelectorAll('.question-block').forEach(b => b.classList.remove('active'));
            currentPage++;
            document.getElementById(`page-${currentPage}`).classList.add('active');
            updateButtons();
        } else {
            submitTurn();
        }
    }

    function prevPage() {
        if (currentPage > 0) {
            document.querySelectorAll('.question-block').forEach(b => b.classList.remove('active'));
            currentPage--;
            document.getElementById(`page-${currentPage}`).classList.add('active');
            updateButtons();
        }
    }

    function submitTurn() {
        let s = { int: 0, pas: 0, com: 0 };
        document.querySelectorAll('.score-input').forEach(i => { s[i.dataset.cat] += parseInt(i.value); });

        if (currentTurn === 'A') {
            partnerA_Scores = s;
            localStorage.setItem('pA_Final', JSON.stringify(s));
            if (mode === 'couple') showStep('handover-step');
            else finalizeResults();
        } else {
            partnerB_Scores = s;
            finalizeResults();
        }
    }

    function startPartnerB() {
        currentTurn = 'B';
        currentPage = 0;
        document.getElementById('user-title').innerText = "Partner B's Turn";
        showStep('test-step');
        renderQuestions();
    }

    function finalizeResults() {
        showStep('results');
        const ctx = document.getElementById('loveTriangleChart').getContext('2d');
        const ds = [{ label: 'Partner A', data: [partnerA_Scores.int, partnerA_Scores.com, partnerA_Scores.pas], backgroundColor: 'rgba(231, 76, 60, 0.4)', borderColor: '#e74c3c' }];
        if (partnerB_Scores) ds.push({ label: 'Partner B', data: [partnerB_Scores.int, partnerB_Scores.com, partnerB_Scores.pas], backgroundColor: 'rgba(52, 152, 219, 0.4)', borderColor: '#3498db' });
        
        new Chart(ctx, {
            type: 'radar',
            data: { labels: ['Intimacy', 'Commitment', 'Passion'], datasets: ds },
            options: { scales: { r: { suggestedMax: 25, ticks: { display: false } } }, maintainAspectRatio: false }
        });
        document.getElementById('analysisText').innerHTML = "<h3>Analysis Complete</h3><p>Your results are based on 15 scientific data points.</p>";
    }
</script>
</body>
</html>

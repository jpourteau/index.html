<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The F.R.P. Clinical Profile</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f9; padding: 20px; color: #333; line-height: 1.6; }
        .container { max-width: 750px; margin: auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-style: italic; margin-bottom: 30px; }
        .section { margin-bottom: 35px; padding: 25px; border: 1px solid #e1e8ed; border-radius: 15px; }
        .category-title { font-weight: bold; font-size: 1.2em; margin-bottom: 15px; text-transform: uppercase; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .question { margin-bottom: 20px; }
        .question label { display: block; margin-bottom: 8px; font-weight: 500; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccd1d9; background: #fff; cursor: pointer; }
        button { width: 100%; padding: 18px; background: #2c3e50; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.2em; transition: 0.3s; }
        button:hover { background: #34495e; transform: translateY(-2px); }
        .result-box { margin-top: 30px; padding: 30px; border-radius: 15px; display: none; line-height: 1.8; animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .score-bar { height: 10px; background: #eee; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        .score-fill { height: 100%; width: 0%; transition: width 1s ease-in-out; }
    </style>
</head>
<body>
    <nav style="text-align: center; padding: 20px; background: #f4f4f4;">
   <a href="index.html">F.R.P. Profile</a> | 
   <a href="communication.html">Communication Assessment</a> | 
   <a href="trust.html">Trust Assessment</a>
</nav>

<div class="container">
    <h1>The F.R.P. Clinical Profile</h1>
    <p class="subtitle">Identify the Root of Your Relationship Control</p>

    <form id="frpQuiz">
        <div class="section" style="border-left: 10px solid #e74c3c;">
            <div class="category-title" style="color:#e74c3c;">F - Fear (Anxiety & Protection)</div>
            <div class="question"><label>1. I feel physical anxiety when I don't know the details of my partner's plans.</label>
                <select class="f-score"><option value="1">1 (Never)</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5 (Always)</option></select></div>
            <div class="question"><label>2. I believe if I don't manage things, a major catastrophe will occur.</label>
                <select class="f-score"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
            <div class="question"><label>3. I monitor my partner's behavior to "protect" them from mistakes.</label>
                <select class="f-score"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
            <div class="question"><label>4. My need to control increases significantly when I am stressed or tired.</label>
                <select class="f-score"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
        </div>

        <div class="section" style="border-left: 10px solid #3498db;">
            <div class="category-title" style="color:#3498db;">R - Rigidity (Rules & Structure)</div>
            <div class="question"><label>5. I have a "correct" way for almost every household task (dishes, laundry, etc).</label>
                <select class="r-score"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
            <div class="question"><label>6. I get upset when my partner suggests a spontaneous change to our schedule.</label>
                <select class="r-score"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
            <div class="question"><label>7. I value order and predictability more than my partner's spontaneous ideas.</label>
                <select class="r-score"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
            <div class="question"><label>8. I find myself "parenting" my partner with step-by-step instructions.</label>
                <select class="r-score"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
        </div>

        <div class="section" style="border-left: 10px solid #27ae60;">
            <div class="category-title" style="color:#27ae60;">P - Pride (Superiority & Competence)</div>
            <div class="question"><label>9. I feel that my logic is superior to my partner's way of thinking.</label>
                <select class="p-score"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
            <div class="question"><label>10. Winning an argument or having the last word is very important to me.</label>
                <select class="p-score"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
            <div class="question"><label>11. I feel a secret satisfaction when my partner fails after ignoring my advice.</label>
                <select class="p-score"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
            <div class="question"><label>12. I struggle to apologize or admit I was wrong, even when I know I was.</label>
                <select class="p-score"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
        </div>

        <button type="button" onclick="analyzeFRP()">Analyze My Clinical Profile</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
function analyzeFRP() {
    let fTotal = 0, rTotal = 0, pTotal = 0;
    document.querySelectorAll('.f-score').forEach(s => fTotal += parseInt(s.value));
    document.querySelectorAll('.r-score').forEach(s => rTotal += parseInt(s.value));
    document.querySelectorAll('.p-score').forEach(s => pTotal += parseInt(s.value));

    const rb = document.getElementById('resultBox');
    rb.style.display = 'block';
    
    let lead = "FEAR"; let color = "#e74c3c"; let advice = "";
    if (rTotal > fTotal && rTotal > pTotal) { lead = "RIGIDITY"; color = "#3498db"; }
    else if (pTotal > fTotal && pTotal > rTotal) { lead = "PRIDE"; color = "#27ae60"; }

    if(lead === "FEAR") advice = "<strong>Repair Action: Surrender the Future.</strong> Your control is a shield. Practice yielding even when you feel anxious about the outcome. Trust the relationship more than the results.";
    if(lead === "RIGIDITY") advice = "<strong>Repair Action: Embrace the Gray.</strong> Your control is a blueprint. Practice flexibility by purposely doing something 'the wrong way' once a day. Value harmony over your specific method.";
    if(lead === "PRIDE") advice = "<strong>Repair Action: Choose Equality.</strong> Your control is a pedestal. Practice humility by asking for your partner's wisdom and accepting their influence without correction.";

    rb.style.borderLeft = "10px solid " + color;
    rb.style.background = color + "10"; // Very light version of the color
    rb.innerHTML = `<h2 style="color:${color}; margin-top:0;">Your Lead Fence: ${lead}</h2>
                    <p><strong>F Score:</strong> ${fTotal}/20 | <strong>R Score:</strong> ${rTotal}/20 | <strong>P Score:</strong> ${pTotal}/20</p>
                    <p>${advice}</p>
                    <p style="font-size: 0.9em; color: #666; margin-top: 15px;">*A score above 15 in any category indicates a primary driver of disconnection.*</p>`;
    
    window.scrollTo({ top: rb.offsetTop - 20, behavior: 'smooth' });
}
</script>
</body>
</html>

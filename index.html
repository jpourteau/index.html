<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relationship Growth Tools</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; line-height: 1.6; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .section { margin-bottom: 40px; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        h2 { border-bottom: 2px solid #34495e; padding-bottom: 10px; color: #2c3e50; }
        button { width: 100%; padding: 15px; background: #2c3e50; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        input[type=range] { width: 100%; margin: 15px 0; }
        #timerDisplay { font-size: 2em; font-weight: bold; color: #e74c3c; text-align: center; margin: 10px 0; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Relationship Toolkit</h1>

    <div class="section" style="background: #fffcf5; border: 1px solid #f1c40f;">
        <h2>The 60-Second Pause</h2>
        <p>Before you act on an impulse to control, take a breath. Let the adrenaline fade.</p>
        <div id="timerDisplay">60</div>
        <button onclick="startTimer()" style="background:#f39c12;">Start My Pause</button>
    </div>

    <div class="section">
        <h2>The F.R.P. Assessment</h2>
        <p>Identify your root of control: <strong>F</strong>ear, <strong>R</strong>igidity, or <strong>P</strong>ride.</p>
        <label><strong>Fear Score (4-20):</strong> Anxiety about mistakes.</label>
        <input type="range" id="f_val" min="4" max="20" value="10">
        <label><strong>Rigidity Score (4-20):</strong> Need for rules.</label>
        <input type="range" id="r_val" min="4" max="20" value="10">
        <label><strong>Pride Score (4-20):</strong> Need to be "right."</label>
        <input type="range" id="p_val" min="4" max="20" value="10">
        <button onclick="runFRP()">Analyze Root</button>
        <div id="frpRes" class="result-box"></div>
    </div>

    <div class="section">
        <h2>The Motive Switch</h2>
        <p>Flip from "Avoidance" (Away) to "Approach" (Toward).</p>
        <select id="motiveIn" style="width:100%; padding:10px; margin-bottom:10px;">
            <option value="mad">I don't want them to be mad.</option>
            <option value="fail">I'm afraid things will fail.</option>
            <option value="reject">I don't want to feel rejected.</option>
        </select>
        <button onclick="runSwitch()" style="background:#27ae60;">Flip the Motive</button>
        <div id="motiveRes" class="result-box" style="background:#f4f9f4; border-left:6px solid #27ae60;"></div>
    </div>
</div>

<script>
function startTimer() {
    let timeLeft = 60;
    const display = document.getElementById('timerDisplay');
    display.style.display = 'block';
    const interval = setInterval(() => {
        timeLeft--;
        display.innerHTML = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(interval);
            display.innerHTML = "Breath Complete. Now choose equality.";
        }
    }, 1000);
}

function runFRP() {
    const f = parseInt(document.getElementById('f_val').value);
    const r = parseInt(document.getElementById('r_val').value);
    const p = parseInt(document.getElementById('p_val').value);
    const res = document.getElementById('frpRes');
    res.style.display = 'block';
    res.style.background = '#f9f9f9';
    let lead = (f >= r && f >= p) ? "FEAR (Anxiety)" : (r >= f && r >= p) ? "RIGIDITY (Rules)" : "PRIDE (Superiority)";
    res.innerHTML = "<strong>Your Primary Root: " + lead + "</strong><br>The fence you've built is based on " + lead.toLowerCase() + ". Your goal is to Yield and Accept Influence today.";
}

function runSwitch() {
    const val = document.getElementById('motiveIn').value;
    const res = document.getElementById('motiveRes');
    res.style.display = 'block';
    let text = (val === 'mad') ? "Switch to: 'I value our peace.'" : (val === 'fail') ? "Switch to: 'I trust our growth.'" : "Switch to: 'I desire closeness.'";
    res.innerHTML = "<strong>The Switch:</strong> " + text;
}
</script>
</body>
</html>

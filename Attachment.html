<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Attachment Map</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; color: #2c3e50; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .instruction-bar { background: #fff9db; padding: 15px; border-left: 5px solid #f1c40f; margin-bottom: 25px; border-radius: 4px; font-size: 0.9em; }
        .step { display: none; }
        .active { display: block; }
        .question { margin-bottom: 20px; padding: 15px; border-bottom: 1px solid #eee; }
        select { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ddd; margin-top: 10px; font-size: 16px; }
        .nav-btns { display: flex; justify-content: space-between; margin-top: 25px; }
        button { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-next { background: #3498db; color: white; }
        .btn-back { background: #95a5a6; color: white; }
        #result-box { background: #f9f9f9; padding: 20px; border-radius: 10px; border-top: 5px solid #3498db; margin-top: 20px; }
        .highlight { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="instruction-bar">
        <strong>Instructions:</strong> Rate 1 (Strongly Disagree) to 5 (Strongly Agree). This assessment identifies your attachment blueprint.
    </div>

    <div id="step1" class="step active">
        <h2>Partner A: Your Patterns</h2>
        <div id="q-list"></div>
        <div class="nav-btns">
            <div></div>
            <button class="btn-next" onclick="showResults()">See Results & Map →</button>
        </div>
    </div>

    <div id="step2" class="step">
        <h2>Your Attachment Profile</h2>
        <div style="height: 400px;"><canvas id="attachmentChart"></canvas></div>
        <div id="result-box">
            <h3>Assessment Prediction:</h3>
            <p id="style-prediction"></p>
        </div>
        <button class="btn-back" style="width:100%; margin-top:20px;" onclick="location.reload()">Restart Assessment</button>
    </div>
</div>

<script>
    const questions = [
        {t: "I find it easy to trust others and depend on them.", c: "sec"},
        {t: "I am comfortable sharing my private thoughts and feelings.", c: "sec"},
        {t: "I often worry that my partner doesn't really love me.", c: "anx"},
        {t: "I get frustrated when others don't want to be as close as I do.", c: "anx"},
        {t: "I prefer to keep my distance from romantic partners.", c: "dis"},
        {t: "Independence is more important to me than intimacy.", c: "dis"},
        {t: "I want to be close, but I'm afraid of being let down.", c: "fea"},
        {t: "I find it hard to trust others even when I want to.", c: "fea"}
    ];

    function init() {
        const list = document.getElementById('q-list');
        questions.forEach((q, i) => {
            list.innerHTML += `<div class="question"><label>${i+1}. ${q.t}</label>
                <select class="ans" data-cat="${q.c}">
                    <option value="1">1 - Strongly Disagree</option>
                    <option value="2">2</option>
                    <option value="3" selected>3 - Neutral</option>
                    <option value="4">4</option>
                    <option value="5">5 - Strongly Agree
